services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: portfolio-redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes --maxmemory-policy noeviction"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # DESENVOLVIMENTO APENAS. Para produção, ver docs/feature-production-readiness/
  # NEO4J-ISOLATION.md seção 6: credenciais reais, TLS, usuário dedicado e o
  # plugin do GDS embutido numa imagem em vez de bind-mount.
  neo4j:
    image: neo4j:5-community
    container_name: portfolio-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/portfolio123"
      # Sandbox liberado apenas para as procedures do GDS que o ranker usa
      # (app/code_graph/ranker.py). `gds.*` liberava a biblioteca inteira sem
      # necessidade — só estas cinco são chamadas.
      NEO4J_dbms_security_procedures_unrestricted: "gds.graph.project,gds.graph.exists,gds.graph.drop,gds.pageRank.stream,gds.util.asNode"
      NEO4J_dbms_security_procedures_allowlist: "gds.graph.project,gds.graph.exists,gds.graph.drop,gds.pageRank.stream,gds.util.asNode"
      NEO4J_server_memory_heap_initial__size: "128m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      # Bind-mount de plugin é conveniência de dev: o jar do GDS vem do disco do
      # host, sem verificação de integridade nem versão fixada na imagem. Em
      # produção, embuta o plugin numa imagem versionada.
      - ./.neo4j-plugins:/var/lib/neo4j/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
